name: modern-docx-omml-generated-output-gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/modern-docx-omml-generated-output-gate.yml"
      - "pom.xml"
      - "samples/**"
      - "regression_set/modern_docx_omml_inventory.json"
      - "scripts/workflow/run_modern_docx_omml_generated_output_gate.py"
      - "scripts/workflow/generate_modern_docx_omml_output_manifest.py"
      - "scripts/workflow/validate_modern_docx_omml.py"
      - "scripts/workflow/validate_modern_docx_omml_structure.py"
      - "src/main/**"
      - "src/test/**"
      - "scripts/transpect/mathml_content.py"
      - "scripts/transpect/prepare_libreoffice_mathml.py"
      - "tests/**"
      - "fixtures/mathml_content/**"
  pull_request:
    paths:
      - ".github/workflows/modern-docx-omml-generated-output-gate.yml"
      - "pom.xml"
      - "samples/**"
      - "regression_set/modern_docx_omml_inventory.json"
      - "scripts/workflow/run_modern_docx_omml_generated_output_gate.py"
      - "scripts/workflow/generate_modern_docx_omml_output_manifest.py"
      - "scripts/workflow/validate_modern_docx_omml.py"
      - "scripts/workflow/validate_modern_docx_omml_structure.py"
      - "src/main/**"
      - "src/test/**"
      - "scripts/transpect/mathml_content.py"
      - "scripts/transpect/prepare_libreoffice_mathml.py"
      - "tests/**"
      - "fixtures/mathml_content/**"

jobs:
  generated-output-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and build patch-docx jar
        run: mvn -q package

      - name: Run Python regression tests
        run: |
          python3 -m unittest discover -s tests
          python3 -m unittest discover -s scripts/workflow -p 'test_*.py'

      - name: Run modern DOCX + OMML generated-output gate
        run: python3 scripts/workflow/run_modern_docx_omml_generated_output_gate.py

      - name: Write GitHub job summary
        if: always()
        run: python3 scripts/workflow/render_modern_docx_omml_gate_summary.py --write-github-step-summary

      - name: Upload generated-output gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-docx-omml-generated-output-gate-report
          path: out/modern-docx-omml-generated/modern_docx_omml_generated_output_gate_report.json
          if-no-files-found: error
