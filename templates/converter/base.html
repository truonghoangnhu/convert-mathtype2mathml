<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MathType → MathML Converter{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        nav { background: #2c3e50; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #ecf0f1; text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
        nav a:hover { color: #3498db; }
        nav .brand { font-size: 1.2rem; font-weight: 700; color: #fff; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 1.5rem; margin-bottom: 1.5rem; }
        .card h2 { margin-bottom: 1rem; color: #2c3e50; }
        .btn { display: inline-block; padding: 0.6rem 1.2rem; border: none; border-radius: 5px; cursor: pointer; font-size: 0.95rem; text-decoration: none; color: #fff; }
        .btn-primary { background: #3498db; }
        .btn-primary:hover { background: #2980b9; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #219a52; }
        .btn-danger { background: #e74c3c; }
        .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.85rem; }
        input[type="file"], input[type="text"], input[type="password"], input[type="email"] {
            width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 0.8rem; font-size: 0.95rem;
        }
        label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
        .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
        .checkbox-row label { margin: 0; font-weight: 400; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.7rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; color: #fff; }
        .badge-pending { background: #f39c12; }
        .badge-processing { background: #3498db; }
        .badge-completed { background: #27ae60; }
        .badge-failed { background: #e74c3c; }
        .alert { padding: 0.8rem 1rem; border-radius: 5px; margin-bottom: 1rem; }
        .alert-info { background: #d1ecf1; color: #0c5460; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-warning { background: #fff3cd; color: #856404; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .preview-frame { width: 100%; min-height: 500px; border: 1px solid #ddd; border-radius: 5px; background: #fff; }
        .form-row { margin-bottom: 1rem; }
        .helptext { font-size: 0.85rem; color: #777; }
        .errorlist { list-style: none; color: #e74c3c; font-size: 0.9rem; margin-bottom: 0.5rem; }
        footer { text-align: center; padding: 2rem; color: #999; font-size: 0.85rem; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
    <nav>
        <span class="brand">MathType → MathML</span>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'history' %}">History</a>
                <a href="{% url 'logout' %}">Logout ({{ user.username }})</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <footer>MathType → MathML Converter &copy; 2026</footer>
</body>
</html>
